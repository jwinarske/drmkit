[package]
name = "drmkit-scene"
description = "Scene composition for drmkit: buffer sources, layer lowering, and atomic commit orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["graphics", "os::linux-apis"]
keywords = ["drm", "kms", "compositor", "scene", "scanout"]

[dependencies]
drmkit-core = { workspace = true }
drmkit-display = { workspace = true }
drmkit-dumb = { workspace = true }
drmkit-log = { workspace = true }
drmkit-fmt = { workspace = true }
drmkit-planes = { workspace = true }
drmkit-sync = { workspace = true }
rustix = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[dev-dependencies]
# Device cases report when they bail without asserting.
drmkit-testkit = { workspace = true }
rustix = { workspace = true, features = ["std", "event"] }
drmkit-fmt = { workspace = true }
# Path-only, because drmkit-scene-sources depends on this crate: a versioned
# dev-dependency would make each wait on the other at publish time. Cargo
# drops a path-only one from the published manifest.
drmkit-scene-sources = { path = "../drmkit-scene-sources" }
drm = { workspace = true }
drmkit-modeset = { workspace = true }
# The plane-order cases read the screen back.
drmkit-capture = { workspace = true }

[lints]
workspace = true
