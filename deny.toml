# cargo-deny — supply-chain gate for the lint lane (plan §10).
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "riscv64gc-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# drmkit is MIT, matching drm-cxx. Permissive-only: this ships in embedded
# products where a copyleft transitive would be a licensing incident.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

# jpeg-encoder is "(MIT OR Apache-2.0) AND IJG": its DCT derives from the
# Independent JPEG Group's code. IJG is permissive, but asks a binary
# distribution's documentation to credit the IJG. Scoped to that crate, which
# only the optional `jpeg` feature of drmkit-capture pulls in, rather than
# allowed everywhere.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Two dev-dependencies are path-only on purpose: the testkit, which is never
# published, and drmkit-scene's on drmkit-scene-sources, which would otherwise
# be a cycle at publish time. Cargo drops both from the published manifests.
# This lets path dependencies through for unpublished crates and for
# dev-dependencies of published ones; a versionless *normal* dependency of a
# published crate is still refused.
allow-wildcard-paths = true
# Nothing in the tree may pull a second DRM binding: drmkit-core wraps the
# Smithay `drm` crate and never re-binds (DR-2).
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
