# drmkit — Rust port of drm-cxx (behavioral-parity port; see plan.md).
#
# Baseline: jwinarske/drm-cxx @ 2b260d0 (v5.0.0, PR #362).
# The crate map in plan.md §5 lists every crate and what it ports.

[workspace]
resolver = "3"
members = [
    "crates/drmkit",
    "crates/drmkit-core",
    "crates/drmkit-dumb",
    "crates/drmkit-fmt",
    "crates/drmkit-display",
    "crates/drmkit-capture",
    "crates/drmkit-cursor",
    "crates/drmkit-gbm",
    "crates/drmkit-scene-gbm",
    "crates/drmkit-csd",
    "crates/drmkit-scene-set",
    "crates/drmkit-input",
    "crates/drmkit-log",
    "crates/drmkit-modeset",
    "crates/drmkit-planes",
    "crates/drmkit-present",
    "crates/drmkit-scene",
    "crates/drmkit-session",
    "crates/drmkit-scene-sources",
    "crates/drmkit-sync",
    "crates/drmkit-testkit",
    "crates/drmkit-time",
    "tests-integration",
    "benches/plane-stress",
    "parity/runner",
    "validation/drmdb",
    "validation/probe",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
authors = ["Joel Winarske <joel.winarske@linux.com>"]
repository = "https://github.com/jwinarske/drmkit"
homepage = "https://github.com/jwinarske/drmkit"
keywords = ["drm", "kms", "display", "graphics", "embedded"]
categories = ["graphics", "os::linux-apis"]

[workspace.dependencies]
drmkit-core = { version = "0.0.0", path = "crates/drmkit-core" }
drmkit-dumb = { version = "0.0.0", path = "crates/drmkit-dumb" }
drmkit-gbm = { version = "0.0.0", path = "crates/drmkit-gbm" }
drmkit-scene-gbm = { version = "0.0.0", path = "crates/drmkit-scene-gbm" }
drmkit-scene-set = { version = "0.0.0", path = "crates/drmkit-scene-set" }
drmkit-capture = { version = "0.0.0", path = "crates/drmkit-capture" }
drmkit-cursor = { version = "0.0.0", path = "crates/drmkit-cursor" }
# Path-only: the testkit is never published, and only a path-only
# dev-dependency is dropped from a published manifest rather than looked up on
# crates.io.
drmkit-testkit = { path = "crates/drmkit-testkit" }
drmkit-display = { version = "0.0.0", path = "crates/drmkit-display" }
drmkit-fmt = { version = "0.0.0", path = "crates/drmkit-fmt" }
drmkit-input = { version = "0.0.0", path = "crates/drmkit-input" }
drmkit-log = { version = "0.0.0", path = "crates/drmkit-log" }
drmkit-modeset = { version = "0.0.0", path = "crates/drmkit-modeset" }
drmkit-planes = { version = "0.0.0", path = "crates/drmkit-planes" }
drmkit-present = { version = "0.0.0", path = "crates/drmkit-present" }
drmkit-scene = { version = "0.0.0", path = "crates/drmkit-scene" }
drmkit-session = { version = "0.0.0", path = "crates/drmkit-session" }
drmkit-scene-sources = { version = "0.0.0", path = "crates/drmkit-scene-sources" }
drmkit-sync = { version = "0.0.0", path = "crates/drmkit-sync" }
drmkit-time = { version = "0.0.0", path = "crates/drmkit-time" }

drm = { version = "0.15" }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
png = { version = "0.18" }
libseat = { version = "0.2" }
# default-features = false drops the wayland keymap-fd helper (and memmap2 with
# it); drmkit compiles keymaps from names, a file, or a buffer it already has.
# default-features = false drops the crate's own `log` routing, which would
# install a second libinput log handler over drmkit's, and pins the libinput
# API level explicitly rather than inheriting whatever the default is.
input = { version = "0.10", default-features = false, features = ["udev", "libinput_1_19"] }
udev = { version = "0.9", default-features = false }
xkbcommon = { version = "0.9", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
libloading = "0.8"
# v0_3 gates the accessors this port needs -- colour primaries, HDR static
# metadata, signal colorimetry -- against the system library's version. It
# matches the 0.3.0 libdisplay-info these bindings are for.
libdisplay-info = { version = "0.3", features = ["v0_3"] }
drm-ffi = { version = "0.9" }
rustix = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

# Workspace-wide lint policy (plan §7). Every crate opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"          # edition 2024 default; kept explicit
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"      # every `unsafe` carries a // SAFETY:
missing_safety_doc = "deny"
# `anyhow` is banned in library code; each crate carries a `thiserror` enum
# whose discriminants mirror the C++ std::error_code paths (plan §5).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Parity ports read closer to the C++ when the module path stays explicit.
module_name_repetitions = "allow"
# Every public struct with public fields, and every public enum, says
# whether a later release may add to it. What the library hands out --
# reports, capabilities, events, results -- is `#[non_exhaustive]`, so adding
# a field or variant is not a breaking change. The rest carries an `allow`
# with its reason: a value defined by its fields (a rectangle, a colour), a
# config built with `..Default::default()`, an input callers must build with
# no default to fill a new field from, a closed set, or an enum whose
# exhaustive match elsewhere in the tree is the point. Leaving it undecided
# fails clippy.
exhaustive_structs = "warn"
exhaustive_enums = "warn"

[profile.release]
debug = 1          # HIL + perf lanes need symbols; T6 thresholds are measured here
overflow-checks = true

[profile.bench]
debug = 1
