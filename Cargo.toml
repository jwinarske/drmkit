# drmkit — Rust port of drm-cxx (behavioral-parity port; see plan.md).
#
# Baseline: jwinarske/drm-cxx @ dc2915b (v2.0.1, PR #231).
# Phase 0 carries only the leaf crates plus xtask; the crate map in plan.md §5
# lists the full set and the phase that lands each one.

[workspace]
resolver = "3"
members = [
    "crates/drmkit",
    "crates/drmkit-core",
    "crates/drmkit-dumb",
    "crates/drmkit-fmt",
    "crates/drmkit-display",
    "crates/drmkit-capture",
    "crates/drmkit-cursor",
    "crates/drmkit-gbm",
    "crates/drmkit-input",
    "crates/drmkit-log",
    "crates/drmkit-modeset",
    "crates/drmkit-planes",
    "crates/drmkit-scene",
    "crates/drmkit-session",
    "crates/drmkit-scene-sources",
    "crates/drmkit-sync",
    "crates/drmkit-time",
    "tests-integration",
    "benches/plane-stress",
    "parity/runner",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
authors = ["Joel Winarske <joel.winarske@linux.com>"]
repository = "https://github.com/jwinarske/drmkit"
homepage = "https://github.com/jwinarske/drmkit"
keywords = ["drm", "kms", "display", "graphics", "embedded"]
categories = ["graphics", "os::linux-apis", "no-std"]

[workspace.dependencies]
drmkit-core = { version = "0.0.0", path = "crates/drmkit-core" }
drmkit-dumb = { version = "0.0.0", path = "crates/drmkit-dumb" }
drmkit-capture = { version = "0.0.0", path = "crates/drmkit-capture" }
drmkit-cursor = { version = "0.0.0", path = "crates/drmkit-cursor" }
drmkit-display = { version = "0.0.0", path = "crates/drmkit-display" }
drmkit-fmt = { version = "0.0.0", path = "crates/drmkit-fmt" }
drmkit-input = { version = "0.0.0", path = "crates/drmkit-input" }
drmkit-log = { version = "0.0.0", path = "crates/drmkit-log" }
drmkit-modeset = { version = "0.0.0", path = "crates/drmkit-modeset" }
drmkit-planes = { version = "0.0.0", path = "crates/drmkit-planes" }
drmkit-scene = { version = "0.0.0", path = "crates/drmkit-scene" }
drmkit-session = { version = "0.0.0", path = "crates/drmkit-session" }
drmkit-scene-sources = { version = "0.0.0", path = "crates/drmkit-scene-sources" }
drmkit-sync = { version = "0.0.0", path = "crates/drmkit-sync" }
drmkit-time = { version = "0.0.0", path = "crates/drmkit-time" }

drm = { version = "0.15" }
png = { version = "0.18" }
libseat = { version = "0.2" }
# default-features = false drops the wayland keymap-fd helper (and memmap2 with
# it); drmkit compiles keymaps from names, a file, or a buffer it already has.
xkbcommon = { version = "0.9", default-features = false }
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
# v0_3 gates the accessors this port needs -- colour primaries, HDR static
# metadata, signal colorimetry -- against the system library's version. It
# matches the 0.3.0 libdisplay-info these bindings are for.
libdisplay-info = { version = "0.3", features = ["v0_3"] }
drm-ffi = { version = "0.9" }
rustix = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false }

# Workspace-wide lint policy (plan §7). Every crate opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"          # edition 2024 default; kept explicit
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"      # every `unsafe` carries a // SAFETY:
missing_safety_doc = "deny"
# `anyhow` is banned in library code; each crate carries a `thiserror` enum
# whose discriminants mirror the C++ std::error_code paths (plan §5).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Parity ports read closer to the C++ when the module path stays explicit.
module_name_repetitions = "allow"

[profile.release]
debug = 1          # HIL + perf lanes need symbols; T6 thresholds are measured here
overflow-checks = true

[profile.bench]
debug = 1
