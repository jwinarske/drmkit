[package]
name = "xtask"
description = "drmkit repository automation: TEST_PARITY and INVARIANTS drift linters, vkms runner, trace differ."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Dependency-free by intent: this runs on every CI lane including the cross
# lanes, and a dependency tree here is pure latency.
[dependencies]

[lints]
workspace = true

[dev-dependencies]
# Only to pin that the marker xtask greps for is the one testkit prints.
drmkit-testkit = { workspace = true }
