# The vkms lane (plan §9 T5, §10).
#
# This is the structural improvement over drm-cxx's CI, which self-skips its
# integration tests on hosted runners. Here they boot a real kernel with the
# VKMS virtual driver under virtme-ng and are merge-blocking on every PR from
# Phase 0 onward. An integration suite that skips itself in CI is a suite
# nobody runs.
name: vkms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vkms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  vkms:
    name: vkms (virtme-ng)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: install virtme-ng
        run: |
          sudo apt-get update
          # libgbm is named explicitly even though this lane currently links
          # without asking: it arrives as a transitive of the qemu/mesa stack,
          # and depending on that is depending on someone else's dependency
          # list not changing.
          sudo apt-get install -y virtme-ng qemu-system-x86 linux-modules-extra-$(uname -r) libgbm-dev libseat-dev libxkbcommon-dev xkb-data libinput-dev libudev-dev

      - name: confirm vkms is available
        run: modinfo vkms

      # virtme-ng boots the host kernel image directly, and GitHub runners ship
      # /boot/vmlinuz-* readable only by root. Without this the lane fails with
      # "unable to access /boot/vmlinuz-... (check for read permissions)",
      # which reads like a virtme bug rather than a permissions one.
      - name: make the host kernel image readable
        run: sudo chmod +r "/boot/vmlinuz-$(uname -r)"

      # Build on the host, run the resulting binaries in the guest. The obvious
      # alternative -- calling cargo inside the VM -- means dragging the whole
      # toolchain into an environment with no HOME, no PATH, and a read-only
      # root, and it failed for exactly those reasons before this replaced it.
      # The guest needs a kernel and a card, not a build system.
      - name: build test binaries
        run: |
          # `.profile.test` is what separates a test binary from an example
          # or a bin target, which `cargo test --no-run` also builds and which
          # also carry an `executable`. Without it the lane runs examples with
          # `--include-ignored --nocapture` as their argv and counts whatever
          # they make of that as a test failure.
          # `drmkit-display/hotplug` is not a default feature -- it links
          # libudev, which the cross lanes have no sysroot for -- but its
          # cases need a real uevent and root, which is exactly what this
          # lane is. Without it they are built out and never run anywhere.
          cargo test --workspace --features drmkit-display/hotplug,drmkit-present/device --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null
                            and .profile.test == true) | .executable' \
            > test-binaries.txt
          echo "built $(wc -l < test-binaries.txt) test binaries"
          test -s test-binaries.txt

      # Generated on the host so the guest needs no environment passed in:
      # every path and variable is already baked in by the time it boots.
      - name: write guest runner
        run: |
          {
            echo '#!/bin/bash'
            echo '# Runs inside the virtme-ng guest. No cargo, no rustup, no network.'
            echo 'export DRMKIT_TEST_CARD=/dev/dri/card0'
            # Under virtme-ng the suite runs as root with no display server, so
            # it always holds DRM master. Setting this turns "not master" from a
            # tolerated local condition into a lane failure, so a card-dependent
            # test cannot pass here by quietly doing nothing.
            echo 'export DRMKIT_REQUIRE_MASTER=1'
            # vkms defaults its overlay and cursor planes *off* on the kernels
            # these runners ship, which is how twelve device rigs here spent
            # months reporting "1 candidate plane(s)": plane migration,
            # z-order across planes and the composition fallback were all
            # running against a CRTC with nothing to migrate to. Asking for
            # them explicitly is the difference between a lane that exercises
            # the allocator and one that watches it decline to.
            #
            # Falls back to a plain load rather than failing outright, so a
            # kernel that has dropped a parameter still boots the lane -- and
            # DRMKIT_MIN_PLANES below is what makes the coverage loss loud
            # instead of silent.
            echo 'modprobe vkms enable_cursor=1 enable_overlay=1 enable_writeback=1 || modprobe vkms || { echo "FATAL: cannot load vkms"; exit 1; }'
            # Two is the smallest count that makes "put this layer somewhere
            # else" a question with an answer.
            echo 'export DRMKIT_MIN_PLANES=2'
            # And that it is running on what it booted. The lane-health checks
            # assert a modeset card is present; without this they pass on any
            # DRM device, which is not what "the vkms lane" claims.
            echo 'export DRMKIT_EXPECT_DRIVER=vkms'
            echo 'udevadm settle || true'
            echo 'test -e /dev/dri/card0 || { echo "FATAL: vkms loaded but no card node"; exit 1; }'
            echo 'rc=0'
            while read -r bin; do
              echo "echo \"===== $(basename "$bin") =====\""
              # --nocapture so the metric lines the torture cases print reach
              # the log. A threshold whose margin is invisible is one nobody
              # notices tightening until it fails.
              echo "\"$bin\" --include-ignored --nocapture || rc=1"
            done < test-binaries.txt
            echo 'echo "guest runner exiting with $rc"'
            echo 'exit "$rc"'
          } > run-in-vm.sh
          chmod +x run-in-vm.sh
          cat run-in-vm.sh

      # virtme-ng boots the host kernel under KVM in a few seconds and shares
      # the host filesystem, so the binaries built above are visible at the
      # same absolute paths. `--verbose` surfaces boot failures that would
      # otherwise look like a silent test skip.
      - name: run suite under vkms
        # Captured as well as shown: the coverage check below reads it, and a
        # run whose log is only in the web UI cannot be checked against
        # anything.
        run: |
          set -o pipefail
          vng --run --verbose --cpus 2 --memory 2G --exec "$PWD/run-in-vm.sh" \
            2>&1 | tee vkms-run.txt

      # Which cases actually asserted here, rather than how many reported ok.
      # vkms is the only target in the pool that is a virtualized driver, so
      # it is the only one that can run the HOTSPOT_X case at all -- and it is
      # the lane P-20 hid in, twelve rigs exercising plane migration on a CRTC
      # with nowhere to migrate to, green throughout.
      #
      # Records the baseline when there is none, so the first green run on a
      # new kernel produces one to commit; checks against it once committed,
      # and fails when a case that asserted here stops doing so.
      - name: check what the lane covered
        run: |
          if [ -f validation/coverage/ci-vkms.json ]; then
            cargo xtask coverage --device=ci-vkms < vkms-run.txt
          else
            cargo xtask coverage --device=ci-vkms --record < vkms-run.txt
            echo "::notice::No coverage baseline for ci-vkms yet. The recorded" \
                 "one is attached to this run; commit it to start gating."
          fi

      - name: keep what the lane covered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-vkms-coverage
          path: |
            validation/coverage/ci-vkms.json
            vkms-run.txt
          retention-days: 30
          if-no-files-found: warn
