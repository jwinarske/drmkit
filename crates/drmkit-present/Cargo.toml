[package]
name = "drmkit-present"
description = "The present spine for drmkit: scanout slot pools, damage accumulation, and frame pacing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Everything that needs a DRM device. Off by default so the spine's pure half
# -- the ring, the negotiator, the economy -- builds and runs under Miri with
# no FFI in front of the interpreter, the same arrangement drmkit-planes uses
# for its probe.
default = []
device = [
    "dep:drmkit-core",
    "dep:drmkit-dumb",
    "dep:drmkit-scene",
    "dep:drmkit-planes",
    "drmkit-planes/device",
    "dep:drm",
    "dep:drmkit-modeset",
    "dep:drmkit-display",
    "dep:drmkit-sync",
]
# A GBM-backed producer. Separate from `device` because it links libgbm, which
# a CPU-only consumer of the dumb path has no reason to pull in.
gbm = ["device", "dep:drmkit-scene-sources", "drmkit-scene-sources/gbm"]

[dependencies]
# Modifier classification and the rotation pre-filter the negotiator applies.
drmkit-fmt = { workspace = true }
# `resource_handles`, for turning a CRTC id into its index.
drm = { workspace = true, optional = true }
thiserror = { workspace = true }

drmkit-core = { workspace = true, optional = true }
drmkit-dumb = { workspace = true, optional = true }
drmkit-scene = { workspace = true, optional = true }
drmkit-planes = { workspace = true, optional = true }
drmkit-modeset = { workspace = true, optional = true }
drmkit-display = { workspace = true, optional = true }
drmkit-sync = { workspace = true, optional = true }
drmkit-scene-sources = { workspace = true, optional = true }

[dev-dependencies]
# Device cases report which card they ran on and when they bailed.
drmkit-testkit = { workspace = true }
# The backend's restore case drives the CRTC directly to observe teardown.
drm = { workspace = true }
drmkit-dumb = { workspace = true }
drmkit-fmt = { workspace = true }

# The device cases need what the `device` feature pulls in.
[[test]]
name = "dumb_ring_device"
required-features = ["device"]

[[test]]
name = "dumb_sink_device"
required-features = ["device"]

[[test]]
name = "backend_device"
required-features = ["gbm"]
