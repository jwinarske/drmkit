[package]
name = "drmkit-scene-sources"
description = "Tier-1 buffer sources for drmkit scenes: dumb buffers and imported DMA-BUFs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["graphics", "os::linux-apis"]
keywords = ["drm", "kms", "compositor", "dma-buf", "scanout"]

[dependencies]
drm = { workspace = true }
drmkit-core = { workspace = true }
drmkit-cursor = { workspace = true }
drmkit-fmt = { workspace = true }
drmkit-dumb = { workspace = true }
drmkit-gbm = { workspace = true, optional = true }
drmkit-scene = { workspace = true }
drmkit-sync = { workspace = true }
rustix = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[features]
default = []
# A scanout source backed by a GBM allocation. Optional because it pulls in
# libgbm, which a CPU-only consumer has no reason to link.
gbm = ["dep:drmkit-gbm"]

[dev-dependencies]
# Device cases report when they bail without asserting.
drmkit-testkit = { workspace = true }

[lints]
workspace = true
