[package]
name = "drmkit-session"
description = "Session and seat management: revocable devices across VT switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
drmkit-log = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

# The seat backend. Optional because a session is a policy the rest of this
# crate can express without one -- and because there is no way to test the
# binding on a machine with no seat, so it must be possible to build and test
# everything else without pulling it in.
libseat = { workspace = true, optional = true }

[features]
default = ["libseat", "libseat-log"]
libseat = ["dep:libseat"]
# Route libseat's own diagnostics into the `log` crate: the binding's
# `custom_logger`, which builds a C shim against libseat's headers. A feature
# of its own so the docs build, which has no libseat, can leave it out.
libseat-log = ["libseat", "libseat/custom_logger"]

# The seat probe needs a seat binding to probe with.
[[example]]
name = "seat"
required-features = ["libseat"]

[lints]
workspace = true

# docs.rs has no libseat. The binding's `docs_rs` feature skips both the
# library probe and the logger shim, which is enough to document the seat.
[package.metadata.docs.rs]
no-default-features = true
features = ["libseat/docs_rs"]
