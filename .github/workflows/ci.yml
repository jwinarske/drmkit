# Host and cross lanes (plan §10). The vkms lane lives in vkms.yml because it
# needs a kernel, not just a toolchain.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: lint (fmt, clippy, msrv, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.94.1; every component comes from it.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # This job runs --all-features too, so it builds the same -sys crates the
      # test job does. Their build scripts want pkg-config even where clippy
      # itself never links.
      - name: install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libseat-dev libxkbcommon-dev xkb-data libinput-dev libudev-dev meson ninja-build
          # Ubuntu ships libdisplay-info 0.1.1, three minor versions behind the
          # 0.3 API the EDID parser uses -- the accessors for colour primaries,
          # HDR static metadata and signal colorimetry do not exist before it.
          # libdisplay-info-sys probes the system version through pkg-config and
          # fails the build rather than silently compiling a smaller API, which
          # is the right behaviour and leaves building it as the fix.
          #
          # Pinned to the tag the bindings target, so the version CI tests
          # against is the one the crate was written for.
          git clone --depth 1 --branch 0.3.0 \
            https://gitlab.freedesktop.org/emersion/libdisplay-info.git /tmp/ldi
          meson setup /tmp/ldi/build /tmp/ldi --prefix=/usr/local --buildtype=release
          sudo meson install -C /tmp/ldi/build
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features

      # cargo-msrv reads `package.rust-version`, which a virtual workspace root
      # does not have. Verify each member against its own manifest instead.
      - name: cargo-msrv verify
        run: |
          cargo install cargo-msrv --locked
          for manifest in crates/*/Cargo.toml; do
            echo "::group::msrv $manifest"
            cargo msrv verify --all-features --manifest-path "$manifest"
            echo "::endgroup::"
          done

      # Doc warnings are their own lane's worth of rot: RUSTFLAGS carries
      # -Dwarnings for the compiler, RUSTDOCFLAGS is separate, and nothing was
      # setting it -- so `missing_docs` was enforced while six broken intra-doc
      # links and an unclosed `<n>` tag sat in the tree unnoticed. A link that
      # does not resolve is a doc that lies about where to look next.
      - name: rustdoc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: test x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # gbm-sys links against libgbm, which the runner image does not carry.
      # Named explicitly rather than left to chance: without it the failure is
      # a linker error naming a library nobody mentioned asking for.
      - name: install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libseat-dev libxkbcommon-dev xkb-data libinput-dev libudev-dev meson ninja-build
          # Ubuntu ships libdisplay-info 0.1.1, three minor versions behind the
          # 0.3 API the EDID parser uses -- the accessors for colour primaries,
          # HDR static metadata and signal colorimetry do not exist before it.
          # libdisplay-info-sys probes the system version through pkg-config and
          # fails the build rather than silently compiling a smaller API, which
          # is the right behaviour and leaves building it as the fix.
          #
          # Pinned to the tag the bindings target, so the version CI tests
          # against is the one the crate was written for.
          git clone --depth 1 --branch 0.3.0 \
            https://gitlab.freedesktop.org/emersion/libdisplay-info.git /tmp/ldi
          meson setup /tmp/ldi/build /tmp/ldi --prefix=/usr/local --buildtype=release
          sudo meson install -C /tmp/ldi/build
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib" >> "$GITHUB_ENV"
      # T0 unit, T1 property, T4 doctests.
      - run: cargo test --workspace --all-features

  drift:
    name: drift (TEST_PARITY + INVARIANTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The linters compare against upstream, so upstream has to be present.
      # Pinned to the plan's baseline: a moving reference would make this lane
      # fail for reasons unrelated to the commit under test. Bumping the pin is
      # a deliberate, reviewable change.
      - uses: actions/checkout@v4
        with:
          repository: jwinarske/drm-cxx
          # Full 40-character SHA: actions/checkout cannot resolve an
          # abbreviated one.
          ref: dc2915b9f76856ea5791cb416e9facdef6262678
          path: .drm-cxx-ref
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check --ref .drm-cxx-ref

  cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            # libc6-dev-*-cross is named explicitly rather than relied on as a
            # transitive of gcc-*-linux-gnu: without the cross sysroot the
            # compiler is present but nothing that links can be built, and the
            # failure reads as a code error rather than a missing package.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          - target: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      # `xtask` is host-only repository tooling — it is excluded everywhere in
      # this lane. Cross-building it proves nothing and only needs a sysroot.
      # drmkit-gbm and drmkit-session are held out of the *build* because
      # gbm-sys and libseat-sys link against C libraries and there is no cross
      # sysroot for either here: adding a foreign
      # architecture to the runner's apt sources is fragile on amd64 and worse
      # for riscv64, where the package may not exist at all. The real targets
      # have libgbm; the runner does not.
      #
      # Only the link needs it, so `cargo check` below still compiles both
      # crates for the target and no portability coverage is lost -- which is
      # what these lanes are for. A type error, a bad cast, an assumption about
      # pointer width would all still fail here.
      #
      # drmkit-session is built and tested *without* its seat backend here.
      # libseat-sys's build script needs pkg-config to find libseat for the
      # target, which fails even for `cargo check` -- so unlike gbm there is no
      # way to type-check the binding cross. The sequencing is the part with
      # the logic in it, and it is covered on every target; the binding is
      # covered on the host lanes, where the library is installed.
      - run: cargo build --workspace --exclude xtask --exclude drmkit-gbm --exclude drmkit-session --exclude drmkit-input --target ${{ matrix.target }}
      - run: cargo check -p drmkit-gbm --target ${{ matrix.target }}
      - run: cargo build -p drmkit-session --no-default-features --target ${{ matrix.target }}
      # qemu-user runs T0 under the cross target; the runner comes from the
      # per-target .cargo fragment.
      - run: cargo test --workspace --exclude xtask --exclude drmkit-gbm --exclude drmkit-session --exclude drmkit-input --target ${{ matrix.target }}
      - run: cargo test -p drmkit-session --no-default-features --target ${{ matrix.target }}
      # drmkit-input splits three ways because its two C libraries behave
      # differently. libudev-sys runs pkg-config in its build script, so the
      # libinput half cannot even be checked cross -- held out like the seat.
      # xkbcommon has no build script and prebuilt input-sys bindings need
      # none either, so the keymap half type-checks for every target and only
      # its link wants a library the runner has for amd64 alone.
      - run: cargo check -p drmkit-input --no-default-features --features xkb --target ${{ matrix.target }}
      - run: cargo test -p drmkit-input --no-default-features --target ${{ matrix.target }}

  fuzz:
    name: fuzz smoke (T2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly is a *tool* exception, the same one the miri lane takes:
      # cargo-fuzz needs it for sanitizer instrumentation, and no drmkit crate
      # uses a nightly language feature. The fuzz crate is outside the
      # workspace so its nightly-only dependency cannot leak into a normal
      # build (DR-3).
      - run: rustup toolchain install nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # The EDID target pulls drmkit-display with the edid feature, so this job
      # needs the same library the lint and test jobs build. Ubuntu's is 0.1.1;
      # see those jobs for why that is not enough.
      - name: install libdisplay-info
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libxkbcommon-dev xkb-data libinput-dev libudev-dev meson ninja-build
          git clone --depth 1 --branch 0.3.0 \
            https://gitlab.freedesktop.org/emersion/libdisplay-info.git /tmp/ldi
          meson setup /tmp/ldi/build /tmp/ldi --prefix=/usr/local --buildtype=release
          sudo meson install -C /tmp/ldi/build
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib" >> "$GITHUB_ENV"
      # What makes a 60-second run worth anything is that it starts where the
      # last one finished. Nothing did that: fuzz/corpus is gitignored,
      # rust-cache carries ~/.cargo and target/ but not this, and the mkdir
      # below made a fresh empty one every time -- so every run was 60 seconds
      # from the checked-in seeds and the word "cumulative" below described
      # something that was not happening.
      #
      # Keyed by run id and restored by prefix, so each run saves its own and
      # picks up the newest previous one. Corpora only ever grow more useful,
      # so a stale restore is still a better start than nothing.
      - name: restore the fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # cargo-fuzz creates the managed corpus directory itself only when it
      # is not told which directories to use. The targets below name theirs
      # explicitly -- so that libFuzzer writes there rather than into the
      # checked-in seeds -- which means creating them here. `mkdir -p` leaves
      # a restored corpus alone.
      - run: mkdir -p corpus/edid_blob corpus/cursor_file
        working-directory: fuzz
      # Short runs on every PR, cumulative through the cache above.
      - run: cargo +nightly fuzz run in_formats_blob -- -max_total_time=60
        working-directory: fuzz
      # EDID arrives over a wire nobody controls and is malformed in the field
      # constantly, so it earns its own target rather than sharing one.
      # Two corpus directories, in this order, on purpose: libFuzzer writes
      # new inputs into the *first* one it is given. Passing the seed
      # directory alone -- as this did -- means the fuzzer's own output lands
      # in the checked-in seeds, which is invisible in ephemeral CI and
      # deposits a few hundred files in the working tree of anyone who runs it
      # locally. The managed corpus takes the writes; the seeds are read.
      #
      # Seeded because without a valid EDID the fuzzer never gets past the
      # 8-byte magic -- there is no coverage signal from inside
      # libdisplay-info, an uninstrumented C library -- and spends the whole
      # minute on the rejection path. Measured before seeding: 15.5M
      # executions, corpus stuck at one 1-byte input.
      # LSAN_OPTIONS carries one suppression, for a 4-byte leak inside
      # libdisplay-info's di_info_parse_edid that a malformed EDID reaches.
      # It is scoped to this step and to that library; see
      # fuzz/lsan-suppressions.txt for the stack and the reproducer. Turning
      # leak detection off wholesale would defeat running under a sanitizer
      # at all.
      - run: cargo +nightly fuzz run edid_blob corpus/edid_blob seeds/edid_blob -- -max_total_time=60
        working-directory: fuzz
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/fuzz/lsan-suppressions.txt
      # A cursor file is untrusted input from a user theme directory, and every
      # number in it sizes an allocation. Seeded for the same reason as EDID:
      # without a valid file to start from the fuzzer spends the minute failing
      # the 4-byte magic. The seeds cover a static cursor, a multi-resolution
      # pack, an animated one, and a frame at the dimension limit.
      - run: cargo +nightly fuzz run cursor_file corpus/cursor_file seeds/cursor_file -- -max_total_time=60
        working-directory: fuzz

  # T3's other half. The miri lane below covers the fd-free crates; these are
  # the ones it cannot touch, because linking the drm bindings puts FFI in
  # front of the interpreter even in tests that never open a device.
  #
  # Verified to have teeth rather than assumed: a deliberate one-past-the-end
  # read in a scratch test is caught as `heap-buffer-overflow` with the frame
  # named. A sanitizer lane that cannot fail is just more green.
  asan:
    name: sanitizers (T3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly is a tool exception, the same one miri and fuzz take: no crate
      # may use a nightly language feature. `-Zsanitizer` and `-Zbuild-std` do
      # not exist on stable, and build-std is what puts an instrumented std
      # underneath -- without it the sanitizer sees only this tree's frames.
      - run: rustup toolchain install nightly --component rust-src
      - uses: Swatinem/rust-cache@v2
      # drmkit-input pulls libudev-sys, xkbcommon and libinput through their
      # -sys crates, and their build scripts run pkg-config. The seven crates
      # in the first step need none of this; the second step does, and adding
      # that step without these is what made this lane's first run fail.
      - name: install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev xkb-data libinput-dev libudev-dev
      # `--lib --tests` and not the default target set: doctests fail to link
      # under the sanitizer, and a lane red for that reason teaches people to
      # ignore it. Device cases are `#[ignore]`d and do not run here; what this
      # covers is the host-side logic of crates Miri is shut out of.
      #
      # gbm, session, input and display are left out: each links an
      # uninstrumented C library, which LeakSanitizer reports on and which the
      # fuzz lane already needed a suppression for. Adding them means adding
      # suppressions, and a suppression file is how a sanitizer stops finding
      # things.
      - run: >
          cargo +nightly test
          -p drmkit-core -p drmkit-dumb -p drmkit-modeset -p drmkit-sync
          -p drmkit-scene -p drmkit-cursor -p drmkit-capture
          -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
        env:
          RUSTFLAGS: -Zsanitizer=address
      # drmkit-input separately, with leak detection off.
      #
      # It belongs under a sanitizer more than anything else here:
      # `libinput_log::install` is a va_list trampoline that renders a
      # `va_list` into a fixed buffer through vsnprintf, and docs/phase0-spikes.md
      # committed it to "a `// SAFETY:` block plus an ASan run (T3)" when that
      # shim was decided on. This is that run.
      #
      # Leak detection is off because `input` leaks its boxed
      # `libinput_interface` once per context: `Box::into_raw` at
      # context.rs:185 and :219 with no matching `from_raw` in `Drop`, sixteen
      # bytes a context, reported to Smithay/input.rs#99. The allocation is
      # attributed to whichever of our functions constructed the context, so a
      # targeted suppression would have to name our own frames and would hide
      # our own leaks with it -- which is worse than saying plainly that leak
      # detection does not run here.
      #
      # Everything else the sanitizer does still runs, including the
      # buffer-overflow detection the trampoline is here for; checked with a
      # deliberate one-past-the-end read, which is still caught with
      # detect_leaks=0.
      - run: >
          cargo +nightly test -p drmkit-input
          -Zbuild-std --target x86_64-unknown-linux-gnu --lib --tests
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=0
      # ThreadSanitizer, on the only crate that has any concurrency to observe.
      #
      # The plan calls TSan "interesting only where the C++ used atomics ...
      # the Rust equivalents should reduce to Mutex/channel and mostly retire
      # the question". Measured, that is right, and further than it claims: the
      # three modules the C++ used atomics for are ring (no shared-state
      # primitive at all), pool (two Mutexes) and seat (Rc/RefCell, which is
      # not Send). No library code in this tree spawns a thread. The only
      # atomics left are a log level and a test clock.
      #
      # What is left is drmkit-modeset, whose tests spawn waker threads to
      # drive the EINTR case invariant 3 is about -- real concurrency around a
      # descriptor, and the one place a race could hide. Seconds to check.
      #
      # A race exits 66 without needing halt_on_error, so the lane fails rather
      # than printing a warning and passing; verified with a deliberate
      # unsynchronised static.
      - run: >
          cargo +nightly test -p drmkit-modeset
          -Zbuild-std --target x86_64-unknown-linux-gnu --lib
        env:
          RUSTFLAGS: -Zsanitizer=thread

  miri:
    name: miri (pure crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly here is a *tool* exception, not a code one: no crate may use a
      # nightly feature (plan §2). Miri simply does not exist on stable.
      - run: rustup toolchain install nightly --component miri
      - uses: Swatinem/rust-cache@v2
      # Only the fd-free crates. The fd-bound ones are sanitizer territory (T3).
      - run: cargo +nightly miri test -p drmkit-log -p drmkit-time -p drmkit-fmt
      # drmkit-planes belongs here and was missing: the unsafe policy in
      # plan §11 names "`planes` matching" among the crates Miri covers, and
      # the crate is fd-free by default -- drm, drmkit-core and rustix are all
      # behind the `device` feature, precisely so the allocator and the matcher
      # run on caller-supplied capabilities. Hopcroft-Karp is index arithmetic
      # over adjacency lists, which is what Miri is for.
      #
      # Targets named explicitly to leave out matching_properties: proptest
      # writes its regression file, and `getcwd` is unavailable under Miri's
      # isolation, so the target aborts rather than running. That suite is
      # covered on the normal test lane; what is wanted here is the
      # deterministic cases under the interpreter. 79 of them, ~17s.
      - run: cargo +nightly miri test -p drmkit-planes --lib --test allocator
      # drmkit-present is core-only by design -- the GPU producers are
      # separate crates -- so the whole thing is pure logic and belongs here
      # for the same reason the matcher does.
      - run: cargo +nightly miri test -p drmkit-present
