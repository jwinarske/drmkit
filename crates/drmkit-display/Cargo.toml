[package]
name = "drmkit-display"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Display characterisation and colour handling for drmkit"
repository.workspace = true

[lints]
workspace = true


[features]
# EDID parsing, off by default because libdisplay-info-sys links against a
# system library. Keeping it optional is what lets the cross lanes build this
# crate at all: they have no sysroot for it, and drmkit-display carries the
# tone mapper and colour curves that everything downstream wants.
default = []
edid = ["dep:libdisplay-info"]
hotplug = ["dep:udev"]

[dependencies]
libdisplay-info = { workspace = true, optional = true }
thiserror = { workspace = true }
drm = { workspace = true }
drmkit-core = { workspace = true }
# For `ModeInfo`, the extension trait that reads a mode. The mode list hands
# back the kernel's modes; reading them is the modeset crate's job.
drmkit-modeset = { workspace = true }
# `ScanoutTarget` picks a CRTC's primary plane, which means enumerating
# planes. Upstream's scanout_target includes plane_registry.hpp for the same
# reason.
drmkit-planes = { workspace = true }
drmkit-fmt = { workspace = true }
rustix = { workspace = true, features = ["std"] }
# The hotplug watch. Optional because libudev-sys runs pkg-config in its build
# script, so a target with no sysroot for it cannot even type-check this --
# and the rest of the crate, the tone mapper and colour curves included, is
# what the cross lanes are there to cover.
udev = { workspace = true, optional = true }


# The hotplug cases need the watch they are testing.
[[test]]
name = "hotplug_device"
required-features = ["hotplug"]

[dev-dependencies]
# The device tests poll the hotplug socket and ask whether they can write a
# uevent, neither of which the library itself needs.
rustix = { workspace = true, features = ["std", "event", "process"] }
# The hotplug cases need a second, raw monitor for ground truth: "delivered
# nothing" has to be distinguishable from a socket that was never live.
udev = { workspace = true }
