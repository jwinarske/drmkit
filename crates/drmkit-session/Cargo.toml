[package]
name = "drmkit-session"
description = "Session and seat management: revocable devices across VT switches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
drmkit-log = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

# The seat backend. Optional because a session is a policy the rest of this
# crate can express without one -- and because there is no way to test the
# binding on a machine with no seat, so it must be possible to build and test
# everything else without pulling it in.
libseat = { workspace = true, optional = true }

[features]
default = ["libseat", "libseat-log"]
libseat = ["dep:libseat"]
# Released in 0.1.0, when it turned on the binding's own logger, which sent
# libseat's diagnostics to the `log` crate. They now always arrive through
# drmkit-log, so it does nothing more than `libseat`. It stays, and stays a
# default, because 0.1.x promised both.
libseat-log = ["libseat"]

# The seat probe needs a seat binding to probe with.
[[example]]
name = "seat"
required-features = ["libseat"]

# Sets LIBSEAT_BACKEND, which is only sound with no other thread running.
[[test]]
name = "seat_log"
harness = false
required-features = ["libseat"]

[lints]
workspace = true

# docs.rs has no libseat. The binding's `docs_rs` feature skips the library
# probe, which is enough to document the seat.
[package.metadata.docs.rs]
no-default-features = true
features = ["libseat/docs_rs"]
